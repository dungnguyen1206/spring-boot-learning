<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
            integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
            integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
            crossorigin="anonymous"></script>
</head>
<body>

<div class="container mt-5">
    <div class="row d-flex justify-content-center">
        <div class="col-md-5 border rounded shadow-lg p-4">
            <h2 class="my-4 text-center">ATS login</h2>
            <form th:action="@{/auths/login}" method="post">
                <div class="mb-4">

                    <input type="email" class="form-control px-2 py-3" id="email"  name="email" aria-describedby="Enter Your Email"
                           placeholder="Enter Your Email">

                </div>

                <div class="mb-4">

                    <input type="password" class="form-control px-2 py-3" id="password" name="password"
                           aria-describedby="Enter Your Password" placeholder="Enter Your Password">

                </div>
                <a href="#" class="text-decoration-none mb-2">Forgot Password</a>

                <button type="submit" class="btn btn-success w-100 mb-3">Login</button>
                <p>Don't have any account> <a href="#"/></p>
            </form>
        </div>
    </div>
</div>

</body>
</html>
