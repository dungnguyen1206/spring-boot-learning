<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Job Detail </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ATS Platform</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/jobs}">Job Management</a>
                    </li>
                    <li class="nav-item dropdown ">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false" th:text="${session.user.name}">
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Signout</a></li>
                        </ul>
                    </li>

                </ul>
            </div>

        </div>
    </nav>
    <h2 class="mt-5">JOB DETAIL</h2>
    <div th:style="${message} ? 'display:block' : 'display:none'" th:text="${message}"  role="alert">

    </div>
    <hr>
    <form class="mt-3" th:object="${jobRequest}" th:action="@{/jobs}" method="POST" id="createJobForm">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" required th:field="*{title}">
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" required th:field="*{location}">
                </div>
                <div class="mb-3">
                    <label for="minSalary" class="form-label">Min Salary</label>
                    <input type="number" class="form-control" required th:field="*{minSalary}">
                </div>
                <div class="mb-3">
                    <label for="maxSalary" class="form-label">Max Salary</label>
                    <input type="text" class="form-control" required th:field="*{maxSalary}">
                </div>
                <div class="mb-3">
                    <label for="utmSource" class="form-label">Utm Source</label>
                    <input type="text" class="form-control" required th:field="*{utmSource}">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="utmMedia" class="form-label">Utm Media</label>
                    <input type="text" class="form-control" required th:field="*{utmMedia}">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" required th:field="*{description}">Description</textarea>
                </div>
                <div class="mb-3">
                    <label for="deadline" class="form-label">Deadline</label>
                    <input type="datetime-local" class="form-control" required th:field="*{deadline}">
                </div>
                <select class="form-select" aria-label="Default select example" th:field="*{departmentId}">
                    <option selected value="">Open this select menu</option>
                    <option th:each="department :${departments}"
                            th:value="${department.getId()}" th:text="${department.getDepartmentName()}">One
                    </option>

                </select>
                <div class="mb-3" style="display:flex">
                    <div class="row mb-3" th:each="category : ${categories}">
                        <strong class="form-label col-md-6" th:text="${category.categoryName}">Tên Danh Mục</strong>

                        <div th:each="skill : ${category.skills}" class="form-check form-check-inline col-md-9">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:value="${skill.id}"
                                   th:field="*{skillIds}" /> <label class="form-check-label" th:text="${skill.skillName}">Tên Skill</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary my-5" style="width: 15%">Submit</button>
                <button type="reset" class="btn btn-secondary my-5" style="width: 15%" id="btnReset">Reset</button>
            </div>
        </div>

    </form>

</div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" th:inline="javascript">

            function resetForm(){
                const createJobForm = document.getElementById('createJobForm');
                document.getElementById("title").value = "";
                document.getElementById("location").value = "";
                document.getElementById("minSalary").value = "";
                document.getElementById("maxSalary").value = "";
                document.getElementById("utmSource").value = "";
                document.getElementById("deadline").value = "";
                document.getElementById("departmentId").value = "";
                document.getElementById("skillId").value = "";
                document.getElementById("description").value = "";
                createJobForm.reset();
            }

                document.getElementById("btnReset").addEventListener('click', function(){
                    resetForm();
                })


        </script>
</body>
</html>
