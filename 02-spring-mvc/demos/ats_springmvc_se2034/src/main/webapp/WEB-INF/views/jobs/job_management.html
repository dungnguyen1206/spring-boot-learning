<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
<div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ATS Platform</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Job Management</a>
                    </li>
                    <li class="nav-item dropdown ">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false" th:text="${session.user.name}">
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Signout</a></li>
                        </ul>
                    </li>

                </ul>
            </div>

        </div>
    </nav>
    <div class="row d-flex justify-content-center mt-3">

        <div class="col-md-11">
           <div class="card">
               <h2>Job Management</h2>
               <a type="button" class="btn btn-primary my-10" data-toggle="modal" data-target="#exampleModal" th:href="@{/jobs/detail}">Create Jobs</a>
                <div th:style="${message} ? 'display:block' : 'display:none'" th:text="${message}" class="alert alert-success" role="alert">
                </div>
           </div>
            <hr>
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="keyword">
                <button class="btn btn-outline-success me-5" type="submit">Search</button>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Open this select menu</option>
                    <option value="1">Active</option>
                    <option value="2">In-Active</option>
                </select>
            </form>

            <table class="table">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Job title</th>
                    <th scope="col">Description</th>
                    <th scope="col">Location</th>
                    <th scope="col">Min Salary</th>
                    <th scope="col">Max Salary</th>
                    <th scope="col">Status</th>
                    <th scope="col">Deadline</th>
                    <th scope="col" style="width: 15%">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job: ${jobs}">
                    <td th:text="${job.id}"></td>
                    <td th:text="${job.title}"></td>
                    <td th:text="${job.description}"></td>
                    <td th:text="${job.location}"></td>
                    <td th:text="${job.minSalary}"></td>
                    <td th:text="${job.maxSalary}"></td>
                    <td th:text="${job.status}"></td>
                    <td th:text="${job.deadline}"></td>
                    <td>
                        <a class="btn btn-outline-success" href="#" type="button">Edit</a>
                        <a class="btn btn-outline-danger" href="#" type="button">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>


</div>
</body>
</html>
